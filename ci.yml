name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
      - name: Lint with ruff
        run: cd apps/api && ruff check .
      - name: Type check with mypy
        run: cd apps/api && mypy app
      - name: Test
        run: cd apps/api && pytest tests/ --cov

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd apps/miniapp
          npm ci
      - name: Lint
        run: cd apps/miniapp && npm run lint
      - name: Type check
        run: cd apps/miniapp && npm run type-check
      - name: Build
        run: cd apps/miniapp && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest
      - name: Build and push Bot
        uses: docker/build-push-action@v5
        with:
          context: ./apps/bot
          push: true
          tags: ghcr.io/${{ github.repository }}/bot:latest
      - name: Build and push MiniApp
        uses: docker/build-push-action@v5
        with:
          context: ./apps/miniapp
          push: true
          tags: ghcr.io/${{ github.repository }}/miniapp:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway up --detach